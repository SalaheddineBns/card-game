<div
  role="img"
  [attr.aria-label]="ariaLabel()"
  class="relative flex select-none items-center justify-center rounded-xl border-4 border-surface-0 font-black text-card-contrast shadow-lg dark:border-surface-800"
  [class]="faceClasses()"
>
  <span aria-hidden="true">{{ symbol() }}</span>
  <span
    aria-hidden="true"
    class="absolute left-1.5 top-1 text-[0.6rem] font-semibold uppercase tracking-wider"
    >{{ colorName() }}</span
  >
  <span
    aria-hidden="true"
    class="absolute bottom-1 right-1.5 rotate-180 text-[0.6rem] font-semibold uppercase tracking-wider"
    >{{ colorName() }}</span
  >
</div>
