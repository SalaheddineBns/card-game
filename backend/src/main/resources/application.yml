spring:
  application:
    name: card-game-backend
  # Local convenience: read the repo-root .env (the same file docker compose reads). Both paths are optional,
  # so production (env vars only, no .env) is unaffected. Real env vars still win over .env values.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  # Datasource: override with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
  # Locally the password falls back to POSTGRES_PASSWORD from the root .env (shared with docker compose).
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:cardgame}
    username: ${POSTGRES_USER:cardgame}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        # Secure by default; the local profile turns it off for plain http on localhost.
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # error responses are documented explicitly with @ErrorResponses (schema "Problem")
  override-with-generic-response: false
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Local development profile (committed, no secrets). Put secrets/overrides in application-local.yml.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    # D13: dev-only seed (alice, bob, carol) - local profile only.
    locations: classpath:db/migration,classpath:db/seed
server:
  servlet:
    session:
      cookie:
        secure: false
